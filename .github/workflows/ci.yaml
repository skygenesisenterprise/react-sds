name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PNPM_VERSION: 11.21.0

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check
      - name: ESLint check
        run: pnpm lint:check

  build:
    runs-on: ubuntu-latest
    needs: format_and_lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (types + assets + dist, includes the full TypeScript typecheck)
        run: pnpm build
      - name: Package validation (dry-run content of the npm tarball)
        run: pnpm pack --dry-run

  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test

  audit:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

  deploy_storybook:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook -o ./build_storybook
      - name: Deploy to GitHub Pages (gh-pages branch)
        run: npx -y -p gh-pages@6.3.0 gh-pages -d ./build_storybook -u "github-actions-bot <actions@github.com>"

  release_and_publish:
    name: Release and publish on npm
    if: github.event_name == 'push' && github.repository == 'skygenesisenterprise/react-sds'
    runs-on: ubuntu-latest
    needs:
      - test
      - audit
    permissions:
      contents: write
      id-token: write
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_upgraded: ${{ steps.version.outputs.is_upgraded }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Detect version upgrade
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if git tag -l "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "Version ${VERSION} is already released (tag v${VERSION} exists)."
            echo "is_upgraded=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${VERSION} not released yet."
            echo "is_upgraded=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            case "$VERSION" in
              *-*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Build for publish (prePublish: no local-linking artifacts)
        if: steps.version.outputs.is_upgraded == 'true'
        run: pnpm build --prePublish
      - name: Enable short npm import paths (subpath exports)
        if: steps.version.outputs.is_upgraded == 'true'
        run: npx -y -p denoify@1.5.1 enable_short_npm_import_path
        env:
          DRY_RUN: "0"
      - name: Create GitHub release
        if: steps.version.outputs.is_upgraded == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish on npm
        if: steps.version.outputs.is_upgraded == 'true'
        run: |
          EXTRA_ARGS=""
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            EXTRA_ARGS="--tag next"
          fi
          npm publish --provenance $EXTRA_ARGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
