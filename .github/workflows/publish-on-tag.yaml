name: publish-on-tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NPMJS_REGISTRY: https://registry.npmjs.org
  GH_REGISTRY: https://npm.pkg.github.com

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, verify and publish
    if: github.repository == 'skygenesisenterprise/react-sds'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ========================================================================
      # PHASE 1: Setup and Validation
      # ========================================================================

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the pnpm version pinned in package.json
        id: pnpm
        run: |
          set -Eeuo pipefail
          VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using pnpm ${VERSION}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # ========================================================================
      # PHASE 2: Create isolated npmrc configurations
      # ========================================================================

      - name: Create isolated .npmrc files
        id: npmrc
        run: |
          set -Eeuo pipefail

          # Create directory for temporary npmrc files
          NPMRC_DIR="${RUNNER_TEMP}/npmrc"
          mkdir -p "$NPMRC_DIR"

          # --- npmjs .npmrc ---
          NPMJS_NPMRC="${NPMRC_DIR}/npmjs.npmrc"
          printf 'registry=https://registry.npmjs.org/\nalways-auth=true\n' > "$NPMJS_NPMRC"

          # --- GitHub Packages .npmrc ---
          GH_PACKAGES_NPMRC="${NPMRC_DIR}/github-packages.npmrc"
          printf '@skygenesisenterprise:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}\nalways-auth=true\n' > "$GH_PACKAGES_NPMRC"

          # Store paths for later use
          echo "npmjs_npmrc=${NPMJS_NPMRC}" >> "$GITHUB_OUTPUT"
          echo "gh_packages_npmrc=${GH_PACKAGES_NPMRC}" >> "$GITHUB_OUTPUT"
          echo "npmrc_dir=${NPMRC_DIR}" >> "$GITHUB_OUTPUT"

          # Set up cleanup trap
          cleanup_npmrc() {
            rm -f "${NPMJS_NPMRC}" "${GH_PACKAGES_NPMRC}"
            rmdir "${NPMRC_DIR}" 2>/dev/null || true
          }
          trap cleanup_npmrc EXIT

          echo "Created isolated .npmrc files:"
          echo "  npmjs: ${NPMJS_NPMRC}"
          echo "  github-packages: ${GH_PACKAGES_NPMRC}"

      # ========================================================================
      # PHASE 3: Dependency Installation and Validation
      # ========================================================================

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile

      - name: Format check
        run: |
          set -Eeuo pipefail
          pnpm format:check

      - name: ESLint check
        run: |
          set -Eeuo pipefail
          pnpm lint:check

      # ========================================================================
      # PHASE 4: Version and Tag Validation
      # ========================================================================

      - name: Extract version from tag
        id: release
        run: |
          set -Eeuo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not look like a valid vX.Y.Z version."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$TAG_VERSION" == *-* ]]; then
            prerelease="${TAG_VERSION#*-}"
            dist_tag="${prerelease%.*}"
            case "$dist_tag" in
              alpha) dist_tag="alpha" ;;
              beta) dist_tag="beta" ;;
              rc|gamma) dist_tag="rc" ;;
              next) dist_tag="next" ;;
              *) dist_tag="next" ;;
            esac
          else
            dist_tag="latest"
          fi

          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing version $TAG_VERSION (from tag $GITHUB_REF_NAME) with dist-tag: $dist_tag"

      # ========================================================================
      # PHASE 5: Build and Test
      # ========================================================================

      - name: Build (published layout)
        id: build
        run: |
          set -Eeuo pipefail
          pnpm build --prePublish

      - name: Unit tests
        id: test
        run: |
          set -Eeuo pipefail
          pnpm test

      # ========================================================================
      # PHASE 6: Build Artifact Validation
      # ========================================================================

      - name: Assert the build only emitted dist/ and is self-contained
        id: validate-build
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"

          for artifact in legacy dist/package.json dist/src; do
            if [ -e "$artifact" ]; then
              echo "The published build must only emit dist/, found: $artifact" >&2
              exit 1
            fi
          done

          for file in \
            dist/index.js \
            dist/index.d.ts \
            dist/main.css \
            dist/styles/index.css \
            dist/legacy/legacy.css \
            dist/legacy/utility/icons/icons.min.css \
            dist/legacy/favicon/favicon.svg; do
            if [ ! -f "$file" ]; then
              echo "Missing from the published layout: $file" >&2
              exit 1
            fi
          done

          node -e '
            const fs = require("fs"), path = require("path");
            const css = fs.readFileSync("dist/main.css", "utf8");
            const imports = [...css.matchAll(/@import\s+url\((?:"|\x27)?(\.\/[^"\x27)]+)/g)].map(m => m[1]);
            const missing = imports.filter(relative => !fs.existsSync(path.join("dist", relative)));
            if (missing.length) {
              console.error("dist/main.css imports missing files:", missing);
              process.exit(1);
            }
            console.log("dist/main.css imports resolved:", imports.length);
          '

          for bin_file in dist/bin/react-sds.js dist/bin/copy-legacy-to-public.js dist/bin/only-include-used-icons.js; do
            if [ ! -f "$bin_file" ]; then
              echo "Missing bin file: $bin_file" >&2
              exit 1
            fi
          done

          echo "Build validation passed"

      # ========================================================================
      # PHASE 7: Package Creation
      # ========================================================================

      - name: Pack package
        id: pack
        run: |
          set -Eeuo pipefail

          pack_dir="${RUNNER_TEMP}/pack"
          mkdir -p "$pack_dir"

          pnpm pack --pack-destination "$pack_dir"

          tarball="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::pnpm pack produced no tarball"
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Package tarball created: $(basename "$tarball")"

          if [ ! -s "$tarball" ]; then
            echo "::error::Tarball is empty"
            exit 1
          fi

          TARBALL_SHA256="$(sha256sum "$tarball" | awk '{print $1}')"
          echo "tarball_sha256=${TARBALL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "Tarball SHA-256: ${TARBALL_SHA256}"

          echo "Contents of $(basename "$tarball"):"
          tar -tzf "$tarball" | sed 's/^/  /'

          echo ""
          echo "Verifying essential files in tarball..."

          verify_dir="${RUNNER_TEMP}/verify"
          mkdir -p "$verify_dir"
          tar -xzf "$tarball" -C "$verify_dir"

          if [ ! -f "$verify_dir/package/package.json" ]; then
            echo "::error::package/package.json not found in tarball"
            exit 1
          fi

          TARBALL_PKG_VERSION="$(node -p "require('$verify_dir/package/package.json').version")"
          if [ "$TARBALL_PKG_VERSION" != "${{ steps.release.outputs.version }}" ]; then
            echo "::error::Tarball version ($TARBALL_PKG_VERSION) does not match expected"
            exit 1
          fi

          TARBALL_PKG_NAME="$(node -p "require('$verify_dir/package/package.json').name")"
          if [ "$TARBALL_PKG_NAME" != "@skygenesisenterprise/react-sds" ]; then
            echo "::error::Tarball package name mismatch"
            exit 1
          fi

          for file in dist/index.js dist/index.d.ts dist/main.css dist/styles/index.css \
                    dist/legacy/legacy.css dist/bin/react-sds.js; do
            if [ ! -f "$verify_dir/package/$file" ]; then
              echo "::error::Missing file in tarball: $file"
              exit 1
            fi
          done

          if tar -tzf "$tarball" | grep -qE '(\.ts$|\.tsx$|src/|node_modules/|\.git/)'; then
            echo "::warning::Tarball contains unwanted files"
          fi

          rm -rf "$verify_dir"
          echo "Tarball verification passed"

      # ========================================================================
      # PHASE 8: Version Existence Check (with isolated registries)
      # ========================================================================

      - name: Check version existence on npmjs
        id: check-npmjs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "::warning::NPM_TOKEN secret is not set"
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TMP_NPMRC="${RUNNER_TEMP}/npmjs-check.npmrc"
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$NPM_TOKEN" > "$TMP_NPMRC"

          echo "Checking @skygenesisenterprise/react-sds@${VERSION} on npmjs..."

          if output=$(NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --prefer-online 2>&1) || true; then
            if echo "$output" | grep -qE "E401|401 Unauthorized"; then
              echo "::error::npmjs authentication failed (401)"
              rm -f "$TMP_NPMRC"
              echo "status=auth_failed" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            elif echo "$output" | grep -qE "E404|404 Not Found"; then
              echo "::notice::Version not found on npmjs"
              echo "status=not_found" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
            elif echo "$output" | grep -qE "${VERSION}"; then
              echo "::notice::Version already exists on npmjs"
              echo "status=exists" >> "$GITHUB_OUTPUT"
              echo "version_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Unexpected response: $output"
              rm -f "$TMP_NPMRC"
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "::error::Failed to query npmjs: $output"
            rm -f "$TMP_NPMRC"
            echo "status=query_failed" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          rm -f "$TMP_NPMRC"

      - name: Check version existence on GitHub Packages
        id: check-github
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${GH_PACKAGES_TOKEN:-}" ]]; then
            echo "::warning::GH_PACKAGES_TOKEN secret is not set"
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TMP_NPMRC="${RUNNER_TEMP}/gh-check.npmrc"
          printf '@skygenesisenterprise:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$GH_PACKAGES_TOKEN" > "$TMP_NPMRC"

          echo "Checking @skygenesisenterprise/react-sds@${VERSION} on GitHub Packages..."

          if output=$(NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --prefer-online 2>&1) || true; then
            if echo "$output" | grep -qE "E401|401 Unauthorized"; then
              echo "::error::GitHub Packages authentication failed (401)"
              rm -f "$TMP_NPMRC"
              echo "status=auth_failed" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            elif echo "$output" | grep -qE "E403|403 Forbidden"; then
              echo "::error::GitHub Packages access denied (403)"
              rm -f "$TMP_NPMRC"
              echo "status=access_denied" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            elif echo "$output" | grep -qE "E404|404 Not Found"; then
              echo "::notice::Version not found on GitHub Packages"
              echo "status=not_found" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
            elif echo "$output" | grep -qE "${VERSION}"; then
              echo "::notice::Version already exists on GitHub Packages"
              echo "status=exists" >> "$GITHUB_OUTPUT"
              echo "version_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Unexpected response: $output"
              rm -f "$TMP_NPMRC"
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "::error::Failed to query GitHub Packages: $output"
            rm -f "$TMP_NPMRC"
            echo "status=query_failed" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          rm -f "$TMP_NPMRC"

      # ========================================================================
      # PHASE 9: Publish to npmjs
      # ========================================================================

      - name: Publish to npmjs
        id: publish-npmjs
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is required"
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "${{ steps.check-npmjs.outputs.version_exists }}" == "true" ]]; then
            echo "::notice::Version already exists on npmjs, skipping"
            echo "status=already_published" >> "$GITHUB_OUTPUT"
            TMP_NPMRC="${RUNNER_TEMP}/npmjs-verify.npmrc"
            printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$NPM_TOKEN" > "$TMP_NPMRC"
            if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --prefer-online > /dev/null 2>&1; then
              echo "::notice::Verified version is accessible on npmjs"
              rm -f "$TMP_NPMRC"
              exit 0
            else
              echo "::error::Cannot verify existing version on npmjs"
              rm -f "$TMP_NPMRC"
              echo "status=verification_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          echo "Publishing to npmjs..."
          FINAL_NPMRC="${RUNNER_TEMP}/npmjs-publish.npmrc"
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$NPM_TOKEN" > "$FINAL_NPMRC"

          if NPM_CONFIG_USERCONFIG="$FINAL_NPMRC" npm publish "$TARBALL" \
            --registry "${{ env.NPMJS_REGISTRY }}" \
            --access public \
            --tag "$DIST_TAG" \
            --provenance; then
            echo "::notice::Publish command succeeded"
          else
            echo "::error::npm publish failed"
            rm -f "$FINAL_NPMRC"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          published=false
          for attempt in $(seq 1 30); do
            if NPM_CONFIG_USERCONFIG="$FINAL_NPMRC" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "${{ env.NPMJS_REGISTRY }}" --prefer-online > /dev/null 2>&1; then
              published=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Waiting for npmjs (attempt $attempt/30)..."
              sleep 10
            fi
          done

          rm -f "$FINAL_NPMRC"

          if [[ "$published" == "true" ]]; then
            echo "::notice::Version now available on npmjs"
            echo "status=published" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version not found on npmjs after publish"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ========================================================================
      # PHASE 10: Publish to GitHub Packages
      # ========================================================================

      - name: Publish to GitHub Packages
        id: publish-github
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${GH_PACKAGES_TOKEN:-}" ]]; then
            echo "::error::GH_PACKAGES_TOKEN is required"
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "${{ steps.check-github.outputs.version_exists }}" == "true" ]]; then
            echo "::notice::Version already exists on GitHub Packages, skipping"
            echo "status=already_published" >> "$GITHUB_OUTPUT"
            TMP_NPMRC="${RUNNER_TEMP}/gh-verify.npmrc"
            printf '@skygenesisenterprise:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$GH_PACKAGES_TOKEN" > "$TMP_NPMRC"
            if NPM_CONFIG_USERCONFIG="$TMP_NPMRC" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --prefer-online > /dev/null 2>&1; then
              echo "::notice::Verified version is accessible on GitHub Packages"
              rm -f "$TMP_NPMRC"
              exit 0
            else
              echo "::error::Cannot verify existing version on GitHub Packages"
              rm -f "$TMP_NPMRC"
              echo "status=verification_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          echo "Publishing to GitHub Packages..."
          FINAL_NPMRC="${RUNNER_TEMP}/gh-publish.npmrc"
          printf '@skygenesisenterprise:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$GH_PACKAGES_TOKEN" > "$FINAL_NPMRC"

          if NPM_CONFIG_USERCONFIG="$FINAL_NPMRC" npm publish "$TARBALL" \
            --registry "${{ env.GH_REGISTRY }}"; then
            echo "::notice::Publish command succeeded"
          else
            echo "::error::npm publish to GitHub Packages failed"
            echo "::error::Ensure GH_PACKAGES_TOKEN has write:packages scope"
            rm -f "$FINAL_NPMRC"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          published=false
          for attempt in $(seq 1 30); do
            if NPM_CONFIG_USERCONFIG="$FINAL_NPMRC" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "${{ env.GH_REGISTRY }}" --prefer-online > /dev/null 2>&1; then
              published=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Waiting for GitHub Packages (attempt $attempt/30)..."
              sleep 10
            fi
          done

          rm -f "$FINAL_NPMRC"

          if [[ "$published" == "true" ]]; then
            echo "::notice::Version now available on GitHub Packages"
            echo "status=published" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Version not found on GitHub Packages after publish"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ========================================================================
      # PHASE 11: Create GitHub Release
      # ========================================================================

      - name: Create GitHub release
        id: release-github
        if: steps.release.outcome == 'success' && steps.publish-npmjs.outcome == 'success' && steps.publish-github.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release.outputs.dist_tag != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # PHASE 12: Generate Summary
      # ========================================================================

      - name: Summarize publication
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          VALIDATE_BUILD_OUTCOME: ${{ steps.validate-build.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          NPMJS_OUTCOME: ${{ steps.publish-npmjs.outcome }}
          NPMJS_STATUS: ${{ steps.publish-npmjs.outputs.status }}
          GITHUB_OUTCOME: ${{ steps.publish-github.outcome }}
          GITHUB_STATUS: ${{ steps.publish-github.outputs.status }}
          RELEASE_GITHUB_OUTCOME: ${{ steps.release-github.outcome }}
          CHECK_NPMJS_STATUS: ${{ steps.check-npmjs.outputs.status }}
          CHECK_GITHUB_STATUS: ${{ steps.check-github.outputs.status }}
        run: |
          set -Eeuo pipefail

          result_for() {
            local outcome="$1"
            local status="$2"
            case "$outcome" in
              success)
                case "$status" in
                  already_published) printf 'Skip (exists)' ;;
                  published) printf 'Published' ;;
                  not_found) printf 'Not found' ;;
                  exists) printf 'Exists' ;;
                  token_missing) printf 'Token missing' ;;
                  auth_failed) printf 'Auth failed' ;;
                  access_denied) printf 'Access denied' ;;
                  verification_failed) printf 'Verify failed' ;;
                  *) printf 'Success' ;;
                esac ;;
              failure) printf 'FAILED' ;;
              skipped) printf 'Skipped' ;;
              cancelled) printf 'Cancelled' ;;
              *) printf 'Not run' ;;
            esac
          }

          get_status() {
            local step="$1"
            local outcome="${step}_OUTCOME"
            local status="${step}_STATUS"
            result_for "${!outcome}" "${!status}"
          }

          {
            echo "### Publication Summary for @skygenesisenterprise/react-sds@${VERSION:-unresolved}"
            echo ""
            echo "**Tag:** ${GITHUB_REF_NAME:-N/A}"
            echo "**Commit:** ${GITHUB_SHA::8}"
            echo "**Node.js:** v${{ env.NODE_VERSION }}"
            echo "**pnpm:** v${{ steps.pnpm.outputs.version }}"
            echo "**Dist Tag:** ${DIST_TAG:-latest}"
            echo ""
            echo "**Tarball:** $(basename "${TARBALL:-not created}")"
            echo "**SHA-256:** ${TARBALL_SHA256:-not available}"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Version resolution | $(result_for "$RELEASE_OUTCOME") |"
            echo "| Format check | $(result_for "$BUILD_OUTCOME") |"
            echo "| ESLint check | $(result_for "$BUILD_OUTCOME") |"
            echo "| Build | $(result_for "$BUILD_OUTCOME") |"
            echo "| Build validation | $(result_for "$VALIDATE_BUILD_OUTCOME") |"
            echo "| Unit tests | $(result_for "$TEST_OUTCOME") |"
            echo "| Packaging | $(result_for "$PACK_OUTCOME") |"
            echo "| npmjs check | $(result_for "${CHECK_NPMJS_STATUS:-not run}" "${CHECK_NPMJS_STATUS:-not run}") |"
            echo "| GH Packages check | $(result_for "${CHECK_GITHUB_STATUS:-not run}" "${CHECK_GITHUB_STATUS:-not run}") |"
            echo "| **npmjs.com** | $(get_status "publish-npmjs") |"
            echo "| **GitHub Packages** | $(get_status "publish-github") |"
            echo "| GitHub Release | $(result_for "$RELEASE_GITHUB_OUTCOME") |"
            echo ""
            echo "**Environment:** ${{ github.repository }} | ${{ github.workflow }} | Run ${{ github.run_id }}"
            echo ""

            if [[ "$NPMJS_OUTCOME" == "failure" ]]; then
              echo "npmjs publication failed. Check NPM_TOKEN secret."
            fi
            if [[ "$GITHUB_OUTCOME" == "failure" ]]; then
              echo "GitHub Packages publication failed. Check GH_PACKAGES_TOKEN has write:packages scope."
            fi
            if [[ "$RELEASE_GITHUB_OUTCOME" == "skipped" ]]; then
              echo "GitHub Release skipped - one or more publications failed."
            fi

            if [[ "${{ steps.check-npmjs.outputs.version_exists }}" == "true" ]] && \
               [[ "${{ steps.check-github.outputs.version_exists }}" == "true" ]]; then
              echo "Both registries already had this version (idempotent)."
            elif [[ "${{ steps.check-npmjs.outputs.version_exists }}" == "false" ]] && \
                 [[ "${{ steps.check-github.outputs.version_exists }}" == "false" ]]; then
              echo "Both registries were updated with this version."
            else
              echo "Partial publish recovered - one registry had the version."
            fi
            echo ""

            if [[ "$RELEASE_GITHUB_OUTCOME" == "success" ]]; then
              echo "SUCCESS: Package published to both registries and GitHub Release created."
            elif [[ "$NPMJS_STATUS" == "published" ]] || [[ "$NPMJS_STATUS" == "already_published" ]] || \
                 [[ "$NPMJS_STATUS" == "exists" ]]; then
              if [[ "$GITHUB_STATUS" == "published" ]] || [[ "$GITHUB_STATUS" == "already_published" ]] || \
                 [[ "$GITHUB_STATUS" == "exists" ]]; then
                echo "PARTIAL: Package on both registries but Release failed."
              else
                echo "PARTIAL: npmjs OK but GitHub Packages failed."
              fi
            elif [[ "$GITHUB_STATUS" == "published" ]] || [[ "$GITHUB_STATUS" == "already_published" ]] || \
                 [[ "$GITHUB_STATUS" == "exists" ]]; then
              echo "PARTIAL: GitHub Packages OK but npmjs failed."
            else
              echo "FAILED: Package publication failed on both registries."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
