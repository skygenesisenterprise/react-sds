name: publish-on-tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NPMJS_REGISTRY: https://registry.npmjs.org
  GH_REGISTRY: https://npm.pkg.github.com

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build, verify and publish
    if: github.repository == 'skygenesisenterprise/react-sds'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the pnpm version pinned in package.json
        id: pnpm
        run: |
          VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using pnpm ${VERSION}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.NPMJS_REGISTRY }}

      - name: Enable npm trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Configure .npmrc for both registries
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          touch "$npmrc"
          
          # Configure GitHub Packages for @skygenesisenterprise scope
          if grep -q '@skygenesisenterprise:registry=' "$npmrc"; then
            sed -i "s|^@skygenesisenterprise:registry=.*|@skygenesisenterprise:registry=https://npm.pkg.github.com/|" "$npmrc"
          else
            printf '\n@skygenesisenterprise:registry=https://npm.pkg.github.com\n' >> "$npmrc"
          fi
          
          # Ensure default registry is npmjs
          if grep -q '^registry=' "$npmrc"; then
            sed -i "s|^registry=.*|registry=https://registry.npmjs.org/|" "$npmrc"
          else
            printf 'registry=https://registry.npmjs.org/\n' >> "$npmrc"
          fi
          
          echo "Configured .npmrc:"
          cat "$npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: ESLint check
        run: pnpm lint:check

      - name: Extract version from tag
        id: release
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not look like a valid vX.Y.Z version."
            exit 1
          fi

          # Get version from package.json
          PKG_VERSION="$(node -p "require('./package.json').version")"
          
          # Verify tag matches package version
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          
          # Determine dist-tag based on SemVer prerelease identifier
          # Use npm's semver logic to extract prerelease label
          if [[ "$TAG_VERSION" == *-* ]]; then
            # Extract prerelease part (everything after the first -)
            prerelease="${TAG_VERSION#*-}"
            # Get the first segment of prerelease (before any dot)
            dist_tag="${prerelease%.*}"
            # Normalize common prerelease identifiers
            case "$dist_tag" in
              alpha) dist_tag="alpha" ;;
              beta) dist_tag="beta" ;;
              rc|gamma) dist_tag="rc" ;;
              next) dist_tag="next" ;;
              *) dist_tag="next" ;;
            esac
          else
            dist_tag="latest"
          fi

          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing version $TAG_VERSION (from tag $GITHUB_REF_NAME) with dist-tag: $dist_tag"

      - name: Build (published layout)
        id: build
        run: pnpm build --prePublish

      - name: Unit tests
        id: test
        run: pnpm test

      - name: Assert the build only emitted dist/ and is self-contained
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          
          for artifact in legacy dist/package.json dist/src; do
            if [ -e "$artifact" ]; then
              echo "The published build must only emit dist/, found: $artifact" >&2
              exit 1
            fi
          done
          
          # Check required files exist
          for file in \
            dist/index.js \
            dist/index.d.ts \
            dist/main.css \
            dist/styles/index.css \
            dist/legacy/legacy.css \
            dist/legacy/utility/icons/icons.min.css \
            dist/legacy/favicon/favicon.svg; do
            if [ ! -f "$file" ]; then
              echo "Missing from the published layout: $file" >&2
              exit 1
            fi
          done
          
          # Verify CSS imports
          node -e '
            const fs = require("fs"), path = require("path");
            const css = fs.readFileSync("dist/main.css", "utf8");
            const imports = [...css.matchAll(/@import\s+url\((?:"|\x27)?(\.\/[^"\x27)]+)/g)].map(m => m[1]);
            const missing = imports.filter(relative => !fs.existsSync(path.join("dist", relative)));
            if (missing.length) {
              console.error("dist/main.css imports missing files:", missing);
              process.exit(1);
            }
            console.log("dist/main.css imports resolved:", imports.length);
          '
          
          # Verify bin files exist
          for bin_file in dist/bin/react-sds.js dist/bin/copy-legacy-to-public.js dist/bin/only-include-used-icons.js; do
            if [ ! -f "$bin_file" ]; then
              echo "Missing bin file: $bin_file" >&2
              exit 1
            fi
          done

      - name: Pack package
        id: pack
        run: |
          set -euo pipefail

          pack_dir="${RUNNER_TEMP}/pack"
          mkdir -p "$pack_dir"
          
          # Pack without --prePublish flag (which is not valid for pnpm pack)
          pnpm pack --pack-destination "$pack_dir"

          tarball="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::pnpm pack produced no tarball"
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Package tarball created: $(basename "$tarball")"
          
          # Verify tarball exists and has content
          if [ ! -s "$tarball" ]; then
            echo "::error::Tarball is empty"
            exit 1
          fi
          
          echo "Contents of $(basename "$tarball"):"
          tar -tzf "$tarball" | sed 's/^/  /'
          
          # Verify essential files are in the tarball
          echo ""
          echo "Verifying essential files in tarball..."
          
          # Get package name from package.json
          PKG_NAME="$(node -p "require('./package.json').name")"
          
          # Create a temp directory to extract and verify
          verify_dir="${RUNNER_TEMP}/verify"
          mkdir -p "$verify_dir"
          tar -xzf "$tarball" -C "$verify_dir"
          
          # Check package.json in tarball
          if [ ! -f "$verify_dir/package/package.json" ]; then
            echo "::error::package/package.json not found in tarball"
            exit 1
          fi
          
          TARBALL_PKG_VERSION="$(node -p "require('$verify_dir/package/package.json').version")"
          if [ "$TARBALL_PKG_VERSION" != "${{ steps.release.outputs.version }}" ]; then
            echo "::error::Tarball version ($TARBALL_PKG_VERSION) does not match expected version (${{ steps.release.outputs.version }})"
            exit 1
          fi
          
          # Check essential entry points based on package.json exports
          # Check main entry
          if [ ! -f "$verify_dir/package/dist/index.js" ]; then
            echo "::error::dist/index.js not found in tarball"
            exit 1
          fi
          
          # Check types entry
          if [ ! -f "$verify_dir/package/dist/index.d.ts" ]; then
            echo "::error::dist/index.d.ts not found in tarball"
            exit 1
          fi
          
          # Check main CSS
          if [ ! -f "$verify_dir/package/dist/main.css" ]; then
            echo "::error::dist/main.css not found in tarball"
            exit 1
          fi
          
          # Check styles index
          if [ ! -f "$verify_dir/package/dist/styles/index.css" ]; then
            echo "::error::dist/styles/index.css not found in tarball"
            exit 1
          fi
          
          # Check legacy assets
          if [ ! -f "$verify_dir/package/dist/legacy/legacy.css" ]; then
            echo "::error::dist/legacy/legacy.css not found in tarball"
            exit 1
          fi
          
          # Check bin files
          if [ ! -f "$verify_dir/package/dist/bin/react-sds.js" ]; then
            echo "::error::dist/bin/react-sds.js not found in tarball"
            exit 1
          fi
          
          # Check that package.json is in the tarball
          if [ ! -f "$verify_dir/package/package.json" ]; then
            echo "::error::package.json not found in tarball"
            exit 1
          fi
          
          # Check that no unwanted files are present
          echo "Checking for unwanted files..."
          if tar -tzf "$tarball" | grep -qE '(\.ts$|\.tsx$|src/|node_modules/|\.git/|\.github/|test/|\.test\.|\.spec\.)'; then
            echo "::warning::Tarball contains files that should not be published"
            tar -tzf "$tarball" | grep -E '(\.ts$|\.tsx$|src/|node_modules/|\.git/|\.github/|test/|\.test\.|\.spec\.)' | sed 's/^/  WARNING: /'
          fi
          
          # Clean up verification directory
          rm -rf "$verify_dir"
          
          echo "Tarball verification passed"

      - name: Publish to npmjs
        id: publish-npmjs
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret NPM_TOKEN is required to publish to npmjs"
            exit 1
          fi

          # Check if version already exists on npmjs
          echo "Checking if @skygenesisenterprise/react-sds@$VERSION exists on npmjs..."
          if lookup="$(npm view "@skygenesisenterprise/react-sds@$VERSION" version --registry "$NPMJS_REGISTRY" --prefer-online 2>&1)" || true; then
            if echo "$lookup" | grep -qE "(E404|404 Not Found|Not Found - GET)"; then
              echo "::notice::@skygenesisenterprise/react-sds@$VERSION is not on npmjs yet"
            elif echo "$lookup" | grep -qE "$VERSION"; then
              echo "::notice::@skygenesisenterprise/react-sds@$VERSION is already on npmjs (skipping)"
              echo "status=already_published" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "$lookup"
              echo "::error::Unexpected response when checking version on npmjs"
              exit 1
            fi
          else
            echo "::error::Could not check whether @skygenesisenterprise/react-sds@$VERSION exists on npmjs"
            exit 1
          fi

          echo "Publishing to npmjs..."
          publish_status=0
          if npm publish "$TARBALL" \
            --registry "$NPMJS_REGISTRY" \
            --access public \
            --tag "$DIST_TAG" \
            --provenance; then
            publish_status=0
          else
            publish_status=$?
          fi

          # Verify publication by checking if the version is available
          published=false
          for attempt in $(seq 1 30); do
            if npm view "@skygenesisenterprise/react-sds@$VERSION" version \
              --registry "$NPMJS_REGISTRY" \
              --prefer-online > /dev/null 2>&1; then
              published=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Waiting for npmjs to serve @skygenesisenterprise/react-sds@$VERSION (attempt $attempt/30)..."
              sleep 10
            fi
          done

          if [[ "$published" == "true" ]]; then
            echo "::notice::@skygenesisenterprise/react-sds@$VERSION is now available on npmjs"
            echo "status=published" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$publish_status" -eq 0 ]]; then
            echo "::error::@skygenesisenterprise/react-sds@$VERSION was not found on npmjs after a successful publish command (waited up to 5 minutes)"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit "$publish_status"

      - name: Publish to GitHub Packages
        id: publish-github
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret GH_PACKAGES_TOKEN is required to publish to GitHub Packages"
            exit 1
          fi

          # Check if version already exists on GitHub Packages
          echo "Checking if @skygenesisenterprise/react-sds@$VERSION exists on GitHub Packages..."
          if lookup="$(npm view "@skygenesisenterprise/react-sds@$VERSION" version --registry "$GH_REGISTRY" --prefer-online 2>&1)" || true; then
            if echo "$lookup" | grep -qE "E403|403 Forbidden"; then
              echo "::error::Permission denied when checking @skygenesisenterprise/react-sds@$VERSION on GitHub Packages"
              echo "::error::Ensure GH_PACKAGES_TOKEN has 'read:packages' and 'write:packages' scopes"
              exit 1
            elif echo "$lookup" | grep -qE "E404|404 Not Found"; then
              echo "::notice::@skygenesisenterprise/react-sds@$VERSION is not on GitHub Packages yet"
            elif echo "$lookup" | grep -qE "$VERSION"; then
              echo "::notice::@skygenesisenterprise/react-sds@$VERSION is already on GitHub Packages (skipping)"
              echo "status=already_published" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "$lookup"
              echo "::error::Unexpected response when checking version on GitHub Packages"
              exit 1
            fi
          fi

          echo "Publishing to GitHub Packages..."
          if npm publish "$TARBALL" --registry "$GH_REGISTRY"; then
            echo "::notice::@skygenesisenterprise/react-sds@$VERSION is published on GitHub Packages"
            echo "status=published" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to publish @skygenesisenterprise/react-sds@$VERSION to GitHub Packages"
            echo "::error::Ensure GH_PACKAGES_TOKEN has 'write:packages' scope and the package scope matches your GitHub org"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create GitHub release
        id: release-github
        if: steps.release.outcome == 'success' && steps.publish-npmjs.outcome == 'success' && steps.publish-github.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release.outputs.dist_tag != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize publication
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          NPMJS_OUTCOME: ${{ steps.publish-npmjs.outcome }}
          NPMJS_STATUS: ${{ steps.publish-npmjs.outputs.status }}
          GITHUB_OUTCOME: ${{ steps.publish-github.outcome }}
          GITHUB_STATUS: ${{ steps.publish-github.outputs.status }}
          RELEASE_GITHUB_OUTCOME: ${{ steps.release-github.outcome }}
        run: |
          result_for() {
            local outcome="$1"
            local status="$2"
            case "$outcome" in
              success)
                if [[ "$status" == "already_published" ]]; then
                  printf '⏭️ already published'
                elif [[ "$status" == "published" ]]; then
                  printf '✅ success'
                else
                  printf '✅ success'
                fi
                ;;
              failure) printf '❌ failed' ;;
              skipped) printf '⏭️ skipped' ;;
              cancelled) printf '⏹️ cancelled' ;;
              *) printf '⚪ not run' ;;
            esac
          }

          get_status() {
            local step="$1"
            local outcome="${step}_OUTCOME"
            local status="${step}_STATUS"
            result_for "${!outcome}" "${!status}"
          }

          {
            echo "### 📦 Publication Summary for @skygenesisenterprise/react-sds@${VERSION:-unresolved}"
            echo ""
            echo "**Tag:** "`${GITHUB_REF_NAME:-N/A}"""
            echo "**Commit:** "`${GITHUB_SHA::8}"""
            echo "**Node.js:** v${{ env.NODE_VERSION }}"
            echo "**pnpm:** v${{ steps.pnpm.outputs.version }}"
            echo "**Dist Tag:** ${DIST_TAG:-latest}"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Version resolution | $(result_for "$RELEASE_OUTCOME") |"
            echo "| Format check | $(result_for "$BUILD_OUTCOME") |"
            echo "| ESLint check | $(result_for "$BUILD_OUTCOME") |"
            echo "| Build | $(result_for "$BUILD_OUTCOME") |"
            echo "| Unit tests | $(result_for "$TEST_OUTCOME") |"
            echo "| Packaging | $(result_for "$PACK_OUTCOME") |"
            echo "| **npmjs.com** | $(get_status "publish-npmjs") |"
            echo "| **GitHub Packages** | $(get_status "publish-github") |"
            echo "| GitHub Release | $(result_for "$RELEASE_GITHUB_OUTCOME") |"
            echo ""
            echo "**Environment:**"
            echo "- Repository: ${{ github.repository }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Run ID: ${{ github.run_id }}"
            echo ""
            echo "**Notes:**"
            if [[ "$NPMJS_OUTCOME" == "failure" ]]; then
              echo "- npmjs publication failed. Check secrets and network connectivity."
            fi
            if [[ "$GITHUB_OUTCOME" == "failure" ]]; then
              echo "- GitHub Packages publication failed. Ensure GH_PACKAGES_TOKEN has 'write:packages' and 'read:packages' scopes."
            fi
            if [[ "$RELEASE_GITHUB_OUTCOME" == "skipped" ]]; then
              echo "- GitHub Release was skipped because one or more publications failed."
            fi
            echo ""
            echo "**Artifact:** ${{ steps.pack.outputs.tarball }}"
          } >> "$GITHUB_STEP_SUMMARY"
