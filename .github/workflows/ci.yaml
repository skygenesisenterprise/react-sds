name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  PNPM_VERSION: 12.18.0

jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check
      - name: ESLint check
        run: pnpm lint:check

  build:
    runs-on: ubuntu-latest
    needs: format_and_lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (types + assets + dist, includes the full TypeScript typecheck)
        run: pnpm build
      - name: Assert build structure
        run: |
          set -euo pipefail
          for file in \
            dist/index.js \
            dist/index.d.ts \
            dist/main.css \
            dist/styles/index.css; do
            if [ ! -f "$file" ]; then
              echo "Missing from the build: $file" >&2
              exit 1
            fi
          done
          node -e '
            const fs = require("fs"), path = require("path");
            const css = fs.readFileSync("dist/main.css", "utf8");
            const imports = [...css.matchAll(/@import\s+url\((?:"|\x27)?(\.\/[^"\x27)]+)/g)].map(m => m[1]);
            const missing = imports.filter(relative => !fs.existsSync(path.join("dist", relative)));
            if (missing.length) {
              console.error("dist/main.css imports missing files:", missing);
              process.exit(1);
            }
            console.log("dist/main.css imports resolved:", imports.length);
          '
      - name: Package validation (dry-run content of the npm tarball)
        run: pnpm pack --dry-run
      - name: Upload build output for runtime tests
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: |
            dist/
            src/fr/generatedFromCss/
          if-no-files-found: error
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download build output for runtime tests
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: ./
      - name: Unit tests
        run: pnpm test

  audit:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

  deploy_storybook:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook -o ./build_storybook
      - name: Deploy to GitHub Pages (gh-pages branch)
        run: npx -y -p gh-pages@6.3.0 gh-pages -d ./build_storybook -u "github-actions-bot <actions@github.com>"

  release_workflow_validation:
    name: Validate release workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test npm semantic-version handling and workflow invariants
        run: bash tests/publish-workflow.test.sh
