name: publish-on-tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NPMJS_REGISTRY: https://registry.npmjs.org

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Build, verify and publish
    if: github.repository == 'skygenesisenterprise/react-sds'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read the pnpm version pinned in package.json
        id: pnpm
        run: |
          VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using pnpm ${VERSION}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.NPMJS_REGISTRY }}

      - name: Enable npm trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Configure .npmrc for both registries
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          touch "$npmrc"
          
          # Configure GitHub Packages for @skygenesisenterprise scope
          if grep -q '@skygenesisenterprise:registry=' "$npmrc"; then
            sed -i "s|^@skygenesisenterprise:registry=.*|@skygenesisenterprise:registry=https://npm.pkg.github.com/|" "$npmrc"
          else
            printf '\n@skygenesisenterprise:registry=https://npm.pkg.github.com\n' >> "$npmrc"
          fi
          
          # Ensure default registry is npmjs
          if grep -q '^registry=' "$npmrc"; then
            sed -i "s|^registry=.*|registry=https://registry.npmjs.org/|" "$npmrc"
          else
            printf 'registry=https://registry.npmjs.org/\n' >> "$npmrc"
          fi
          
          echo "Configured .npmrc:"
          cat "$npmrc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: ESLint check
        run: pnpm lint:check

      - name: Align package.json version with tag
        id: release
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not look like a valid vX.Y.Z version."
            exit 1
          fi

          node -e "const fs=require('fs'); const p='package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg, null, 4) + '\n');" "$VERSION"

          case "$VERSION" in
            *-*) dist_tag="${VERSION##*-}" ;;
            *) dist_tag=latest ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION (from tag $GITHUB_REF_NAME)"

      - name: Build (published layout)
        id: build
        run: pnpm build --prePublish

      - name: Unit tests
        run: pnpm test

      - name: Assert the build only emitted dist/ and is self-contained
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "package.json is at $VERSION but the tag is $GITHUB_REF_NAME." >&2
            exit 1
          fi
          for artifact in legacy dist/package.json dist/src; do
            if [ -e "$artifact" ]; then
              echo "The published build must only emit dist/, found: $artifact" >&2
              exit 1
            fi
          done
          for file in \
            dist/index.js \
            dist/index.d.ts \
            dist/main.css \
            dist/styles/index.css \
            dist/legacy/legacy.css \
            dist/legacy/utility/icons/icons.min.css \
            dist/legacy/favicon/favicon.svg; do
            if [ ! -f "$file" ]; then
              echo "Missing from the published layout: $file" >&2
              exit 1
            fi
          done
          node -e '
            const fs = require("fs"), path = require("path");
            const css = fs.readFileSync("dist/main.css", "utf8");
            const imports = [...css.matchAll(/@import\s+url\((?:"|\x27)?(\.\/[^"\x27)]+)/g)].map(m => m[1]);
            const missing = imports.filter(relative => !fs.existsSync(path.join("dist", relative)));
            if (missing.length) {
              console.error("dist/main.css imports missing files:", missing);
              process.exit(1);
            }
            console.log("dist/main.css imports resolved:", imports.length);
          '

      - name: Pack package
        id: pack
        run: |
          set -euo pipefail

          pack_dir="${RUNNER_TEMP}/pack"
          mkdir -p "$pack_dir"
          pnpm pack --pack-destination "$pack_dir" --prePublish

          tarball="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::pnpm pack produced no tarball"
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Contents of $(basename "$tarball"):"
          tar -tzf "$tarball" | sed 's/^/  /'

      - name: Publish to npmjs
        id: publish-npmjs
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret NPM_TOKEN is required to publish to npmjs"
            exit 1
          fi

          if lookup="$(npm view "@skygenesisenterprise/react-sds@$VERSION" version --registry "$NPMJS_REGISTRY" --prefer-online 2>&1)"; then
            echo "::notice::@skygenesisenterprise/react-sds@$VERSION is already on npmjs"
            exit 0
          elif [[ "$lookup" == *E404* || "$lookup" == *"404 Not Found"* || "$lookup" == *"Not Found - GET"* ]]; then
            echo "::notice::@skygenesisenterprise/react-sds@$VERSION is not on npmjs yet"
          else
            echo "$lookup"
            echo "::error::Could not check whether @skygenesisenterprise/react-sds@$VERSION exists on npmjs"
            exit 1
          fi

          publish_status=0
          if npm publish "$TARBALL" \
            --registry "$NPMJS_REGISTRY" \
            --access public \
            --tag "$DIST_TAG" \
            --provenance; then
            publish_status=0
          else
            publish_status=$?
          fi

          published=false
          for attempt in $(seq 1 30); do
            if npm view "@skygenesisenterprise/react-sds@$VERSION" version \
              --registry "$NPMJS_REGISTRY" \
              --prefer-online > /dev/null 2>&1; then
              published=true
              break
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Waiting for npmjs to serve @skygenesisenterprise/react-sds@$VERSION (attempt $attempt/30)..."
              sleep 10
            fi
          done

          if [[ "$published" == "true" ]]; then
            if [[ "$publish_status" -eq 0 ]]; then
              echo "::notice::@skygenesisenterprise/react-sds@$VERSION is published on npmjs"
            else
              echo "::notice::@skygenesisenterprise/react-sds@$VERSION is now on npmjs; treating the publish as already completed"
            fi
            exit 0
          fi

          if [[ "$publish_status" -eq 0 ]]; then
            echo "::error::@skygenesisenterprise/react-sds@$VERSION was not found on npmjs after a successful publish (waited up to 5 minutes)"
            exit 1
          fi

          exit "$publish_status"

      - name: Publish to GitHub Packages
        id: publish-github
        if: steps.release.outcome == 'success' && steps.pack.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Repository secret GH_PACKAGES_TOKEN is required to publish to GitHub Packages"
            exit 1
          fi

          # Verify package doesn't exist yet on GitHub Packages
          if lookup="$(npm view "@skygenesisenterprise/react-sds@$VERSION" version --registry https://npm.pkg.github.com --prefer-online 2>&1)"; then
            echo "::notice::@skygenesisenterprise/react-sds@$VERSION is already on GitHub Packages"
            exit 0
          elif [[ "$lookup" == *E403* || "$lookup" == *"403 Forbidden"* ]]; then
            echo "::error::Permission denied when checking @skygenesisenterprise/react-sds@$VERSION on GitHub Packages. Ensure GH_PACKAGES_TOKEN has 'read:packages' and 'write:packages' scopes."
            exit 1
          elif [[ "$lookup" == *E404* || "$lookup" == *"404 Not Found"* ]]; then
            echo "::notice::@skygenesisenterprise/react-sds@$VERSION is not on GitHub Packages yet"
          else
            echo "$lookup"
            echo "::error::Could not check whether @skygenesisenterprise/react-sds@$VERSION exists on GitHub Packages"
            exit 1
          fi

          # Publish to GitHub Packages
          if ! npm publish "$TARBALL" --registry https://npm.pkg.github.com; then
            echo "::error::Failed to publish @skygenesisenterprise/react-sds@$VERSION to GitHub Packages"
            echo "::error::Ensure GH_PACKAGES_TOKEN has 'write:packages' scope and the package scope matches your GitHub org/user"
            exit 1
          fi
          
          echo "::notice::@skygenesisenterprise/react-sds@$VERSION is published on GitHub Packages"

      - name: Create GitHub release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release.outputs.dist_tag == 'next' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize publication
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          NPMJS_OUTCOME: ${{ steps.publish-npmjs.outcome }}
          GITHUB_OUTCOME: ${{ steps.publish-github.outcome }}
        run: |
          result_for() {
            case "$1" in
              success) printf '✅ success' ;;
              failure) printf '❌ failed' ;;
              skipped) printf '⏭️ skipped' ;;
              cancelled) printf '⏹️ cancelled' ;;
              *) printf '⚪ not run' ;;
            esac
          }

          {
            echo "### 📦 Publication Summary for @skygenesisenterprise/react-sds@${VERSION:-unresolved}"
            echo
            echo "| Registry | Status |"
            echo "|----------|--------|"
            echo "| Build | $(result_for "$BUILD_OUTCOME") |"
            echo "| Version resolution | $(result_for "$RELEASE_OUTCOME") |"
            echo "| Pack | $(result_for "$PACK_OUTCOME") |"
            echo "| **npmjs.com** | $(result_for "$NPMJS_OUTCOME") |"
            echo "| **GitHub Packages** | $(result_for "$GITHUB_OUTCOME") |"
            echo
            echo "**Note:** If GitHub Packages failed, ensure:"
            echo "- Secret GH_PACKAGES_TOKEN exists with 'write:packages' and 'read:packages' scopes"
            echo "- Package name in package.json is @skygenesisenterprise/react-sds"
          } >> "$GITHUB_STEP_SUMMARY"
