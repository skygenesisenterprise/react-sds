name: publish-on-tag
on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build_and_publish:
        name: Build, verify and publish (npm + GitHub Packages)
        if: github.repository == 'skygenesisenterprise/react-sds'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            packages: write
        steps:
            - uses: actions/checkout@v4
            - name: Read the pnpm version pinned in package.json
              id: pnpm
              run: |
                  VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Using pnpm ${VERSION}"
            - uses: pnpm/action-setup@v4
              with:
                  version: ${{ steps.pnpm.outputs.version }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org/
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Format check
              run: pnpm format:check
            - name: ESLint check
              run: pnpm lint:check
            - name: Align package.json version with tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                    echo "Tag $GITHUB_REF_NAME does not look like a valid vX.Y.Z version." >&2
                    exit 1
                  fi
                  node -e "const fs=require('fs'); const p='package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(pkg, null, 4) + '\n');" "$VERSION"
                  echo "Publishing version $VERSION (from tag $GITHUB_REF_NAME)"
            - name: Build (published layout)
              run: pnpm build --prePublish
            - name: Unit tests
              run: pnpm test
            - name: Assert the build only emitted dist/ and is self-contained
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
                    echo "package.json is at $VERSION but the tag is $GITHUB_REF_NAME." >&2
                    exit 1
                  fi
                  for artifact in legacy dist/package.json dist/src; do
                    if [ -e "$artifact" ]; then
                      echo "The published build must only emit dist/, found: $artifact" >&2
                      exit 1
                    fi
                  done
                  for file in \
                    dist/index.js \
                    dist/index.d.ts \
                    dist/main.css \
                    dist/styles/index.css \
                    dist/legacy/legacy.css \
                    dist/legacy/utility/icons/icons.min.css \
                    dist/legacy/favicon/favicon.svg; do
                    if [ ! -f "$file" ]; then
                      echo "Missing from the published layout: $file" >&2
                      exit 1
                    fi
                  done
                  node -e '
                    const fs = require("fs"), path = require("path");
                    const css = fs.readFileSync("dist/main.css", "utf8");
                    const imports = [...css.matchAll(/@import\s+url\((?:"|\x27)?(\.\/[^"\x27)]+)/g)].map(m => m[1]);
                    const missing = imports.filter(relative => !fs.existsSync(path.join("dist", relative)));
                    if (missing.length) {
                      console.error("dist/main.css imports missing files:", missing);
                      process.exit(1);
                    }
                    console.log("dist/main.css imports resolved:", imports.length);
                  '
            - name: Determine npm dist-tag (next for pre-releases)
              id: dist-tag
              run: |
                  case "$GITHUB_REF_NAME" in
                    *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
                    *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
                  esac
            - name: Package validation (dry-run)
              run: pnpm pack --dry-run
            - name: Publish on npm (public)
              run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  name: Release ${{ github.ref_name }}
                  tag_name: ${{ github.ref_name }}
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ steps.dist-tag.outputs.dist_tag == 'next' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Configure npm for the GitHub Packages registry
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com
                  scope: "@skygenesisenterprise"
            - name: Publish on GitHub Packages
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  if npm view "@skygenesisenterprise/react-sds@${VERSION}" version \
                      --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
                      echo "react-sds@${VERSION} already published on GitHub Packages, skipping."
                  else
                      npm publish
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}