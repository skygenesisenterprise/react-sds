name: publish-on-tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NPMJS_REGISTRY: https://registry.npmjs.org
  GH_REGISTRY: https://npm.pkg.github.com

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify and publish
    if: github.repository == 'skygenesisenterprise/react-sds'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      # ========================================================================
      # PHASE 1: Setup and Validation
      # ========================================================================

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the pnpm version pinned in package.json
        id: pnpm
        run: |
          set -Eeuo pipefail
          VERSION="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using pnpm ${VERSION}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Test npm version comparator
        id: npm_version_tests
        run: node --test tests/npm-version.test.cjs

      - name: Validate publication workflow invariants
        run: bash tests/publish-workflow.test.sh

      - name: Ensure npm version supports Trusted Publishing (11.5.1+)
        id: npm_version
        run: node scripts/ci/ensure-npm-version.cjs


      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile

      - name: Format check
        id: format_check
        run: |
          set -Eeuo pipefail
          pnpm format:check

      - name: ESLint check
        id: lint_check
        run: |
          set -Eeuo pipefail
          pnpm lint:check

      # ========================================================================
      # PHASE 4: Version and Tag Validation
      # ========================================================================

      - name: Extract version from tag
        id: release
        run: |
          set -Eeuo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not look like a valid vX.Y.Z version."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$TAG_VERSION" == *-* ]]; then
            prerelease="${TAG_VERSION#*-}"
            dist_tag="${prerelease%.*}"
            case "$dist_tag" in
              alpha) dist_tag="alpha" ;;
              beta) dist_tag="beta" ;;
              rc|gamma) dist_tag="rc" ;;
              next) dist_tag="next" ;;
              *) dist_tag="next" ;;
            esac
          else
            dist_tag="latest"
          fi

          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing version $TAG_VERSION (from tag $GITHUB_REF_NAME) with dist-tag: $dist_tag"

      # ========================================================================
      # PHASE 5: Build and Test
      # ========================================================================

      - name: Build (published layout)
        id: build
        run: |
          set -Eeuo pipefail
          pnpm build --prePublish

      - name: Unit tests
        id: test
        run: |
          set -Eeuo pipefail
          pnpm test

      # ========================================================================
      # PHASE 6: Build Artifact Validation
      # ========================================================================

      - name: Assert the build only emitted dist/ and is self-contained
        id: validate_build
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.release.outputs.version }}"

          for artifact in legacy dist/package.json dist/src; do
            if [ -e "$artifact" ]; then
              echo "The published build must only emit dist/, found: $artifact" >&2
              exit 1
            fi
          done

          for file in \
            dist/index.js \
            dist/index.d.ts \
            dist/main.css \
            dist/styles/index.css \
            dist/legacy/legacy.css \
            dist/legacy/utility/icons/icons.min.css \
            dist/legacy/favicon/favicon.svg; do
            if [ ! -f "$file" ]; then
              echo "Missing from the published layout: $file" >&2
              exit 1
            fi
          done

          node -e '
            const fs = require("fs"), path = require("path");
            const css = fs.readFileSync("dist/main.css", "utf8");
            const imports = [...css.matchAll(/@import\s+url\((?:"|\x27)?(\.\/[^"\x27)]+)/g)].map(m => m[1]);
            const missing = imports.filter(relative => !fs.existsSync(path.join("dist", relative)));
            if (missing.length) {
              console.error("dist/main.css imports missing files:", missing);
              process.exit(1);
            }
            console.log("dist/main.css imports resolved:", imports.length);
          '

          for bin_file in dist/bin/react-sds.js dist/bin/copy-legacy-to-public.js dist/bin/only-include-used-icons.js; do
            if [ ! -f "$bin_file" ]; then
              echo "Missing bin file: $bin_file" >&2
              exit 1
            fi
          done

          echo "Build validation passed"

      # ========================================================================
      # PHASE 7: Package Creation
      # ========================================================================

      - name: Pack package
        id: pack
        run: |
          set -Eeuo pipefail

          pack_dir="${RUNNER_TEMP}/pack"
          mkdir -p "$pack_dir"

          pnpm pack --pack-destination "$pack_dir"

          tarball="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "::error::pnpm pack produced no tarball"
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Package tarball created: $(basename "$tarball")"

          if [ ! -s "$tarball" ]; then
            echo "::error::Tarball is empty"
            exit 1
          fi

          TARBALL_SHA256="$(sha256sum "$tarball" | awk '{print $1}')"
          echo "tarball_sha256=${TARBALL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "Tarball SHA-256: ${TARBALL_SHA256}"

          echo "Contents of $(basename "$tarball"):"
          tar -tzf "$tarball" | sed 's/^/  /'

          echo ""
          echo "Verifying essential files in tarball..."

          verify_dir="${RUNNER_TEMP}/verify"
          mkdir -p "$verify_dir"
          tar -xzf "$tarball" -C "$verify_dir"

          if [ ! -f "$verify_dir/package/package.json" ]; then
            echo "::error::package/package.json not found in tarball"
            exit 1
          fi

          TARBALL_PKG_VERSION="$(node -p "require('$verify_dir/package/package.json').version")"
          if [ "$TARBALL_PKG_VERSION" != "${{ steps.release.outputs.version }}" ]; then
            echo "::error::Tarball version mismatch"
            exit 1
          fi

          TARBALL_PKG_NAME="$(node -p "require('$verify_dir/package/package.json').name")"
          if [ "$TARBALL_PKG_NAME" != "@skygenesisenterprise/react-sds" ]; then
            echo "::error::Tarball package name mismatch"
            exit 1
          fi

          for file in dist/index.js dist/index.d.ts dist/main.css dist/styles/index.css \
                    dist/legacy/legacy.css dist/bin/react-sds.js; do
            if [ ! -f "$verify_dir/package/$file" ]; then
              echo "::error::Missing file in tarball: $file"
              exit 1
            fi
          done

          if tar -tzf "$tarball" | grep -qE '(\.ts$|\.tsx$|src/|node_modules/|\.git/)'; then
            echo "::warning::Tarball contains unwanted files"
          fi

          rm -rf "$verify_dir"
          echo "Tarball verification passed"

      # ========================================================================
      # PHASE 8: Version Existence Check (with isolated registries)
      # ========================================================================

      - name: Check version existence on npmjs
        id: check_npmjs
        if: ${{ !cancelled() && steps.release.outcome == 'success' && steps.pack.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NPMJS_REGISTRY: ${{ env.NPMJS_REGISTRY }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          set +e
          output="$(npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "${NPMJS_REGISTRY}" --prefer-online 2>&1)"
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            verified_version="$(printf '%s' "$output" | tr -d '"[:space:]')"
            if [[ "$verified_version" != "$VERSION" ]]; then
              echo "::error::npmjs returned an unexpected version"
              echo "status=verification_failed" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "status=exists" >> "$GITHUB_OUTPUT"
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'E404|404 Not Found' <<< "$output"; then
            echo "status=not_found" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version not found on npmjs; publication may proceed"
          else
            echo "::error::Unable to query npmjs (exit $result)"
            echo "status=query_failed" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi


      - name: Check version existence on GitHub Packages
        id: check_github
        if: ${{ !cancelled() && steps.release.outcome == 'success' && steps.pack.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GH_REGISTRY: ${{ env.GH_REGISTRY }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          umask 077
          if [[ -z "${GH_PACKAGES_TOKEN:-}" ]]; then
            echo "::error::GH_PACKAGES_TOKEN secret is not configured"
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          npmrc="${RUNNER_TEMP}/gh-check.npmrc"
          trap 'rm -f "$npmrc"' EXIT
          printf '@skygenesisenterprise:registry=%s\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$GH_REGISTRY" "$GH_PACKAGES_TOKEN" > "$npmrc"
          chmod 600 "$npmrc"
          set +e
          output="$(NPM_CONFIG_USERCONFIG="$npmrc" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "$GH_REGISTRY" --prefer-online 2>&1)"
          result=$?
          set -e
          if [[ "$result" -eq 0 ]]; then
            verified_version="$(printf '%s' "$output" | tr -d '"[:space:]')"
            if [[ "$verified_version" != "$VERSION" ]]; then
              echo "::error::GitHub Packages returned an unexpected version"
              echo "status=verification_failed" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "status=exists" >> "$GITHUB_OUTPUT"
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qE 'E404|404 Not Found' <<< "$output"; then
            echo "status=not_found" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version not found on GitHub Packages; publication may proceed"
          else
            echo "::error::Unable to query GitHub Packages (exit $result)"
            echo "status=query_failed" >> "$GITHUB_OUTPUT"
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ========================================================================
      # PHASE 9: Publish to npmjs
      # ========================================================================

      - name: Publish to npmjs
        id: publish_npmjs
        if: ${{ !cancelled() && steps.release.outcome == 'success' && steps.pack.outcome == 'success' && steps.check_npmjs.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          NPMJS_REGISTRY: ${{ env.NPMJS_REGISTRY }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          if [[ ! -s "$TARBALL" ]]; then
            echo "::error::Package tarball is missing or empty"
            echo "status=artifact_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$TARBALL_SHA256" ]]; then
            echo "::error::Tarball SHA-256 changed after packaging"
            echo "status=artifact_mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "${{ steps.check_npmjs.outputs.version_exists }}" == "true" ]]; then
            verified_version="$(npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "$NPMJS_REGISTRY" --prefer-online)"
            if [[ "$verified_version" != "$VERSION" ]]; then
              echo "::error::Existing npmjs version could not be verified"
              echo "status=verification_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "status=already_published" >> "$GITHUB_OUTPUT"
            echo "::notice::Existing npmjs version verified; publication skipped"
            exit 0
          fi
          echo "Publishing to npmjs using GitHub Actions OIDC Trusted Publishing..."
          if ! npm publish "$TARBALL" --registry "$NPMJS_REGISTRY" --access public --tag "$DIST_TAG" --provenance; then
            echo "::error::npmjs publication failed. Verify the npm Trusted Publisher configuration."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          published=false
          for attempt in $(seq 1 24); do
            if verified_version="$(npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "$NPMJS_REGISTRY" --prefer-online 2>/dev/null)" && [[ "$verified_version" == "$VERSION" ]]; then
              published=true
              break
            fi
            [[ "$attempt" -eq 24 ]] || sleep 5
          done
          if [[ "$published" == "true" ]]; then
            echo "status=published" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is available on npmjs"
          else
            echo "::error::npmjs version was not visible after publication"
            echo "status=verification_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ========================================================================
      # PHASE 10:
      # ========================================================================
      # PHASE 10: Publish to GitHub Packages
      # ========================================================================

      - name: Publish to GitHub Packages
        id: publish_github
        if: ${{ !cancelled() && steps.release.outcome == 'success' && steps.pack.outcome == 'success' && steps.check_github.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GH_REGISTRY: ${{ env.GH_REGISTRY }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          umask 077
          if [[ -z "${GH_PACKAGES_TOKEN:-}" ]]; then
            echo "::error::GH_PACKAGES_TOKEN is required"
            echo "status=token_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ ! -s "$TARBALL" ]]; then
            echo "::error::Package tarball is missing or empty"
            echo "status=artifact_missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          actual_sha256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$TARBALL_SHA256" ]]; then
            echo "::error::Tarball SHA-256 changed after packaging"
            echo "status=artifact_mismatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          npmrc="${RUNNER_TEMP}/gh-publish.npmrc"
          trap 'rm -f "$npmrc"' EXIT
          printf '@skygenesisenterprise:registry=%s\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$GH_REGISTRY" "$GH_PACKAGES_TOKEN" > "$npmrc"
          chmod 600 "$npmrc"
          if [[ "${{ steps.check_github.outputs.version_exists }}" == "true" ]]; then
            verified_version="$(NPM_CONFIG_USERCONFIG="$npmrc" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "$GH_REGISTRY" --prefer-online)"
            if [[ "$verified_version" != "$VERSION" ]]; then
              echo "::error::Existing GitHub Packages version could not be verified"
              echo "status=verification_failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "status=already_published" >> "$GITHUB_OUTPUT"
            echo "::notice::Existing GitHub Packages version verified; publication skipped"
            exit 0
          fi
          echo "Publishing to GitHub Packages..."
          if ! NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$TARBALL" --registry "$GH_REGISTRY"; then
            echo "::error::GitHub Packages publication failed. Verify GH_PACKAGES_TOKEN has package write access."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          published=false
          for attempt in $(seq 1 24); do
            if verified_version="$(NPM_CONFIG_USERCONFIG="$npmrc" npm view "@skygenesisenterprise/react-sds@${VERSION}" version --registry "$GH_REGISTRY" --prefer-online 2>/dev/null)" && [[ "$verified_version" == "$VERSION" ]]; then
              published=true
              break
            fi
            [[ "$attempt" -eq 24 ]] || sleep 5
          done
          if [[ "$published" == "true" ]]; then
            echo "status=published" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is available on GitHub Packages"
          else
            echo "::error::GitHub Packages version was not visible after publication"
            echo "status=verification_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ========================================================================
      # PHASE 11:
      # ========================================================================
      # PHASE 11: Create GitHub Release
      # ========================================================================

      - name: Create GitHub release
        id: release_github
        if: steps.release.outcome == 'success' && steps.publish_npmjs.outcome == 'success' && steps.publish_github.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release.outputs.dist_tag != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # PHASE 12: Generate Summary
      # ========================================================================

      - name: Summarize publication
        if: always()
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          NPM_VERSION: ${{ steps.npm_version.outputs.npm_version }}
          NPM_UPGRADED: ${{ steps.npm_version.outputs.npm_upgraded }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          FORMAT_OUTCOME: ${{ steps.format_check.outcome }}
          LINT_OUTCOME: ${{ steps.lint_check.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_build.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
          CHECK_NPMJS_OUTCOME: ${{ steps.check_npmjs.outcome }}
          CHECK_NPMJS_STATUS: ${{ steps.check_npmjs.outputs.status }}
          CHECK_GITHUB_OUTCOME: ${{ steps.check_github.outcome }}
          CHECK_GITHUB_STATUS: ${{ steps.check_github.outputs.status }}
          PUBLISH_NPMJS_OUTCOME: ${{ steps.publish_npmjs.outcome }}
          PUBLISH_NPMJS_STATUS: ${{ steps.publish_npmjs.outputs.status }}
          PUBLISH_GITHUB_OUTCOME: ${{ steps.publish_github.outcome }}
          PUBLISH_GITHUB_STATUS: ${{ steps.publish_github.outputs.status }}
          RELEASE_GITHUB_OUTCOME: ${{ steps.release_github.outcome }}
        run: |
          set -Eeuo pipefail
          display_status() {
            local outcome="${1:-}" status="${2:-}"
            case "$outcome" in
              success)
                case "$status" in
                  published) echo "Published and verified" ;;
                  already_published) echo "Already published and verified" ;;
                  exists) echo "Already exists" ;;
                  not_found) echo "Not found (ready to publish)" ;;
                  token_missing) echo "Token missing" ;;
                  query_failed) echo "Registry query failed" ;;
                  verification_failed) echo "Verification failed" ;;
                  failed) echo "Failed" ;;
                  *) echo "Success" ;;
                esac ;;
              failure) echo "FAILED" ;;
              skipped) echo "Skipped" ;;
              cancelled) echo "Cancelled" ;;
              *) echo "Not run / unknown" ;;
            esac
          }
          registry_succeeded() { [[ "$1" == "published" || "$1" == "already_published" ]]; }
          npmjs_ok=false
          github_ok=false
          registry_succeeded "${PUBLISH_NPMJS_STATUS:-}" && npmjs_ok=true
          registry_succeeded "${PUBLISH_GITHUB_STATUS:-}" && github_ok=true
          {
            echo "### Publication summary — @skygenesisenterprise/react-sds@${VERSION:-unresolved}"
            echo
            echo "- **Tag:** ${GITHUB_REF_NAME:-unknown}"
            echo "- **Commit:** ${GITHUB_SHA::8}"
            echo "- **npm:** ${NPM_VERSION:-not validated} (upgraded: ${NPM_UPGRADED:-unknown})"
            echo "- **Dist-tag:** ${DIST_TAG:-unknown}"
            echo "- **Tarball:** $(basename "${TARBALL:-not created}")"
            echo "- **SHA-256:** ${TARBALL_SHA256:-not available}"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Version validation | $(display_status "${RELEASE_OUTCOME:-}" "") |"
            echo "| Format | $(display_status "${FORMAT_OUTCOME:-}" "") |"
            echo "| ESLint | $(display_status "${LINT_OUTCOME:-}" "") |"
            echo "| Build | $(display_status "${BUILD_OUTCOME:-}" "") |"
            echo "| Unit tests | $(display_status "${TEST_OUTCOME:-}" "") |"
            echo "| Build validation | $(display_status "${VALIDATE_OUTCOME:-}" "") |"
            echo "| Packaging | $(display_status "${PACK_OUTCOME:-}" "") |"
            echo "| npmjs pre-check | $(display_status "${CHECK_NPMJS_OUTCOME:-}" "${CHECK_NPMJS_STATUS:-}") |"
            echo "| GitHub Packages pre-check | $(display_status "${CHECK_GITHUB_OUTCOME:-}" "${CHECK_GITHUB_STATUS:-}") |"
            echo "| npmjs publication | $(display_status "${PUBLISH_NPMJS_OUTCOME:-}" "${PUBLISH_NPMJS_STATUS:-}") |"
            echo "| GitHub Packages publication | $(display_status "${PUBLISH_GITHUB_OUTCOME:-}" "${PUBLISH_GITHUB_STATUS:-}") |"
            echo "| GitHub Release | $(display_status "${RELEASE_GITHUB_OUTCOME:-}" "") |"
            echo
            if [[ "$npmjs_ok" == "true" && "$github_ok" == "true" && "${RELEASE_GITHUB_OUTCOME:-}" == "success" ]]; then
              echo "**Result: SUCCESS — both registries verified and the GitHub Release was created.**"
            elif [[ "$npmjs_ok" == "true" && "$github_ok" == "true" ]]; then
              echo "**Result: PARTIAL — both registries contain the verified version, but the GitHub Release was not created.**"
            elif [[ "$npmjs_ok" == "true" || "$github_ok" == "true" ]]; then
              echo "**Result: PARTIAL — only one registry has a verified version.**"
            else
              echo "**Result: FAILED — neither registry has a confirmed publication for this run.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
